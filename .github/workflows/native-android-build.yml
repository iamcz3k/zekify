name: Zekify standalone native Android build and v3.5.7 release
on:
  push:
    branches:
      - v3.5.7-recovery
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zekify-v3.5.7-native-release
  cancel-in-progress: false
jobs:
  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble standalone native Android project
        run: |
          mkdir -p android-native/app/src/main/java/com/v3x/zekify
          mkdir -p android-native/app/src/main/assets/help android-native/app/src/main/assets/sports
          cp native-android/*.java android-native/app/src/main/java/com/v3x/zekify/
          cp native-android/help-assets/*.svg android-native/app/src/main/assets/help/
          cp native-android/assets/sports/*.svg android-native/app/src/main/assets/sports/
          cp native-android/assets/sports/LICENSE android-native/app/src/main/assets/sports/
          cp native-android/assets/sports/README.md android-native/app/src/main/assets/sports/ATTRIBUTION.txt
          printf 'ZEKIFY-INTEGRITY-V1:official-native-build' > android-native/app/src/main/assets/zekify-integrity.bin
          cd android-native
          gradle --no-daemon assembleDebug
      - name: Verify native debug build
        run: |
          APK=android-native/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -q 'classes.dex' apk-contents.txt
          ! grep -Eq 'assets/public/(index.html|.*\\.js)' apk-contents.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.v3x.zekify'"
      - name: Configure existing v3.5.7 release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-native/zekify-release.jks
          test -s android-native/zekify-release.jks
          cat >> android-native/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("../zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE
      - name: Build signed v3.5.7 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android-native
          gradle --no-daemon assembleRelease
          cd ..
          cp android-native/app/build/outputs/apk/release/app-release.apk Zekify-v3.5.7.apk
          rm -f android-native/zekify-release.jks
          test -s Zekify-v3.5.7.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.5.7.apk | grep -q "package: name='com.v3x.zekify'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.5.7.apk | grep -q "versionCode='357'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.5.7.apk | grep -q "versionName='3.5.7'"
      - name: Verify APK signature matches existing production key
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v3.5.7.apk | tee signing-certificate.txt
          CERT="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' signing-certificate.txt)"
          echo "Release signing certificate: $CERT"
          test "$CERT" = "f8f7f6f4ee9dabfb6004af5862edffbe78fd48622d90a8ac6eb79128a63f7119" || (echo "Unexpected signing key. Refusing to publish an incompatible update." && exit 1)
      - name: Generate update checksum
        run: sha256sum Zekify-v3.5.7.apk > Zekify-v3.5.7.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zekify-v3.5.7-native-signed-release
          path: |
            Zekify-v3.5.7.apk
            Zekify-v3.5.7.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish recovered v3.5.7 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.5.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v3.5.7 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Zekify v3.5.7" --notes "Zekify v3.5.7 recovery: restored from the verified 21:32 baseline source state, with no fullscreen player redesign or refactor. Existing production signing identity retained."
          gh release upload v3.5.7 Zekify-v3.5.7.apk Zekify-v3.5.7.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v3.5.7 --repo "$GITHUB_REPOSITORY" --title "Zekify v3.5.7" --notes "Zekify v3.5.7 recovery: restored from the verified 21:32 baseline source state, with no fullscreen player redesign or refactor. Existing production signing identity retained."
