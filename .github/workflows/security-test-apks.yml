name: Build Zekify combined security test APKs (no release)
on:
  push:
    branches:
      - security-test
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zekify-security-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-two-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          npm_config_fetch_retries: "3"
          npm_config_fetch_timeout: "120000"
        run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Apply native Android screens and security gate
        run: node scripts/patch-native-android.mjs
      - name: Apply native playback fixes
        run: node scripts/fix-player-playback-state.mjs
      - name: Set app version
        run: |
          sed -i 's/versionCode 1/versionCode 34/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "3.4.0"/' android/app/build.gradle
      - name: Configure official signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/zekify-release.jks
          test -s android/zekify-release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("../zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          GRADLE
      - name: Build original APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v3.4.0-ORIGINAL.apk
          cd ..
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.4.0-ORIGINAL.apk | grep -F "package: name='com.v3x.zekify'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v3.4.0-ORIGINAL.apk | tee original-signature.txt
          CERT="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' original-signature.txt)"
          test "$CERT" = "f8f7f6f4ee9dabfb6004af5862edffbe78fd48622d90a8ac6eb79128a63f7119"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.4.0-ORIGINAL.apk | grep -q "application-debuggable"; then
            echo "Original APK must not be debuggable"
            exit 1
          fi
          sha256sum Zekify-v3.4.0-ORIGINAL.apk > Zekify-v3.4.0-ORIGINAL.apk.sha256
      - name: Verify production R8 obfuscation and native library
        run: |
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path
          with zipfile.ZipFile("Zekify-v3.4.0-ORIGINAL.apk") as z:
              names = z.namelist()
              native = [n for n in names if n.startswith("lib/") and n.endswith("/libzekifyguard.so")]
              dex_names = [n for n in names if re.fullmatch(r"classes(\d+)?\.dex", n)]
              assert native, "Native security library missing from production APK"
              assert dex_names, "DEX bytecode missing from production APK"
              dex = b"".join(z.read(n) for n in dex_names)
              assert b"TEST SIMULATION" not in dex, "Test-only forced detection leaked into production APK"
          mapping_path = Path("android/app/build/outputs/mapping/release/mapping.txt")
          assert mapping_path.is_file() and mapping_path.stat().st_size > 0, "R8 mapping file missing"
          mapping = mapping_path.read_text(errors="replace")
          renamed = re.findall(r"(?m)^com\.v3x\.zekify\.([\w$]+) -> ([\w.$]+):$", mapping)
          assert any(source != target for source, target in renamed), "No Zekify application class was obfuscated by R8"
          print("PASS: production APK contains native verifier, R8 mapping and obfuscated app classes; no test simulation markers.")
          print("Native ABIs:", ", ".join(sorted({n.split('/')[1] for n in native})))
          PY
      - name: Enable combined root, runtime-hook and tracer simulations in test APK only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/java/com/v3x/zekify/SecurityGuard.java")
          s = p.read_text()
          root_anchor = "    private static String findRootIndicators() {"
          hook_anchor = "    private static String findInstrumentationIndicators() {"
          if s.count(root_anchor) != 1 or s.count(hook_anchor) != 1:
              raise SystemExit("Could not uniquely locate security detector methods")
          pattern = re.compile(r'(?m)^            String rootIssue = findRootIndicators\(\);\n            if \(rootIssue != null\) return fail\(rootIssue\);\n            String hookIssue = findInstrumentationIndicators\(\);\n            if \(hookIssue != null\) return fail\(hookIssue\);\n            (?:final int nativeFlags;)', re.M)
          match = pattern.search(s)
          if not match:
              raise SystemExit("Could not uniquely locate root/hook verification sequence")
          replacement = """            StringBuilder combinedIssues = new StringBuilder();
                      String rootIssue = findRootIndicators();
                      if (rootIssue != null) combinedIssues.append(rootIssue);
                      String hookIssue = findInstrumentationIndicators();
                      if (hookIssue != null) {
                          if (combinedIssues.length() > 0) combinedIssues.append("; ");
                          combinedIssues.append(hookIssue);
                      }
                      if (combinedIssues.length() > 0) return fail(combinedIssues.toString());
                      final int nativeFlags;"""
          s = s[:match.start()] + replacement + s[match.end():]
          nl = chr(10)
          root_injection = nl + "        // TEST ONLY: force root-detection response path." + nl + '        if (System.nanoTime() >= 0L) return "TEST SIMULATION: rooted environment (Magisk/KernelSU) detected";'
          hook_injection = nl + "        // TEST ONLY: force runtime-hook and TracerPid response paths." + nl + '        if (System.nanoTime() >= 0L) return "TEST SIMULATION: runtime hooks (Frida/Xposed/LSPosed) and process tracer (TracerPid) detected";'
          s = s.replace(root_anchor, root_anchor + root_injection)
          s = s.replace(hook_anchor, hook_anchor + hook_injection)
          p.write_text(s)
          for marker in ("rooted environment (Magisk/KernelSU)", "runtime hooks (Frida/Xposed/LSPosed)", "process tracer (TracerPid)", "combinedIssues"):
              if marker not in p.read_text():
                  raise SystemExit("Combined security test patch missing: " + marker)
          PY
      - name: Build combined security test APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew clean assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk
          cd ..
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk | grep -F "package: name='com.v3x.zekify'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk | tee combined-security-signature.txt
          CERT="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' combined-security-signature.txt)"
          test "$CERT" = "f8f7f6f4ee9dabfb6004af5862edffbe78fd48622d90a8ac6eb79128a63f7119"
          sha256sum Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk > Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk.sha256
          printf '%s\\n' "TEST ONLY: forces root (Magisk/KernelSU), runtime-hook (Frida/Xposed/LSPosed), and TracerPid detections together. This validates combined blocking only, not detection against real rooted/hooked environments." > COMBINED-SECURITY-TEST-NOTES.txt
      - name: Verify combined test APK contains forced test paths
        run: |
          python3 - <<'PY'
          import re, zipfile
          with zipfile.ZipFile("Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk") as z:
              names = z.namelist()
              assert any(n.startswith("lib/") and n.endswith("/libzekifyguard.so") for n in names), "Native verifier missing from test APK"
              dex = b"".join(z.read(n) for n in names if re.fullmatch(r"classes(\d+)?\.dex", n))
              assert b"TEST SIMULATION" in dex, "Forced test-only detection markers missing"
          print("PASS: test APK contains forced root/hook/tracer simulation paths and native verifier.")
          PY
      - name: Upload exactly two APKs as private workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zekify-v3.4.0-combined-security-test
          path: |
            Zekify-v3.4.0-ORIGINAL.apk
            Zekify-v3.4.0-ORIGINAL.apk.sha256
            Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk
            Zekify-v3.4.0-COMBINED-SECURITY-TEST.apk.sha256
            original-signature.txt
            combined-security-signature.txt
            COMBINED-SECURITY-TEST-NOTES.txt
          if-no-files-found: error
          retention-days: 14
