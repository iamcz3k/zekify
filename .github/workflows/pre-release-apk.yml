name: Zekify pre-release APK verification

on:
  workflow_dispatch:
  push:
    branches:
      - v3.5.6-offline-extras-pre-release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build web bundle
        run: |
          npm install --no-package-lock
          npm run build

      - name: Generate Android platform and assets
        run: |
          npx cap add android
          npm run assets:generate
          npx cap sync android

      - name: Apply native Android implementation
        run: node scripts/patch-native-android.mjs

      - name: Compile pre-release APK (no publishing)
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload pre-release APK
        uses: actions/upload-artifact@v4
        with:
          name: zekify-v3.5.6-pre-release-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
