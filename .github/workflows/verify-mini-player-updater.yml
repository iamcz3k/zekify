name: Verify Zekify mini-player and updater changes
on:
  push:
    branches:
      - feature/youtube-mini-player-updater-fix
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          npm_config_fetch_retries: "3"
          npm_config_fetch_timeout: "120000"
        run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Prove fullscreen implementation is unchanged
        run: |
          git diff --exit-code d05b7577a753fe91394684ddc5205b380571e764...HEAD -- native-android/PlayerActivity.java scripts/fix-player-playback-state.mjs
          echo "Fullscreen player and its compatibility patch are byte-for-byte unchanged from the 8:45 PM recovery checkpoint."
      - name: Apply native Android source
        run: node scripts/patch-native-android.mjs
      - name: Apply native playback compatibility patch
        run: node scripts/fix-player-playback-state.mjs
      - name: Validate Android manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          ns = {'a': 'http://schemas.android.com/apk/res/android'}
          providers = [node for node in root.findall('.//provider') if node.attrib.get('{http://schemas.android.com/apk/res/android}name') == 'androidx.core.content.FileProvider']
          assert providers, 'FileProvider is missing'
          assert providers[0].attrib.get('{http://schemas.android.com/apk/res/android}authorities') == '${applicationId}.fileprovider'
          print('Android manifest and update FileProvider verified')
          PY
      - name: Compile Android debug APK (no release or publishing)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
