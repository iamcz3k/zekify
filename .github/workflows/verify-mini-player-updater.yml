name: Verify Zekify mini-player and updater changes
on:
  push:
    branches:
      - feature/youtube-mini-player-updater-fix
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          npm_config_fetch_retries: "3"
          npm_config_fetch_timeout: "120000"
        run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Prove fullscreen implementation is unchanged
        run: |
          git diff --exit-code d05b7577a753fe91394684ddc5205b380571e764...HEAD -- native-android/PlayerActivity.java scripts/fix-player-playback-state.mjs
          echo "Fullscreen player and its compatibility patch are byte-for-byte unchanged from the 8:45 PM recovery checkpoint."
      - name: Apply native Android source
        run: node scripts/patch-native-android.mjs
      - name: Apply native playback compatibility patch
        run: node scripts/fix-player-playback-state.mjs
      - name: Validate Android manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          ns = {'a': 'http://schemas.android.com/apk/res/android'}
          providers = [node for node in root.findall('.//provider') if node.attrib.get('{http://schemas.android.com/apk/res/android}name') == 'androidx.core.content.FileProvider']
          assert providers, 'FileProvider is missing'
          assert providers[0].attrib.get('{http://schemas.android.com/apk/res/android}authorities') == '${applicationId}.fileprovider'
          print('Android manifest and update FileProvider verified')
          PY
      - name: Set test build version
        run: |
          sed -i 's/versionCode 1/versionCode 357/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "3.5.7-test"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Configure production-compatible signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/zekify-release.jks
          test -s android/zekify-release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("../zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Build signed test APK (no release publishing)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v3.5.7-test.apk
          cd ..
          rm -f android/zekify-release.jks
          test -s Zekify-v3.5.7-test.apk
      - name: Verify production signing certificate
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v3.5.7-test.apk | tee signing-certificate.txt
          CERT="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' signing-certificate.txt)"
          echo "Test APK signing certificate: $CERT"
          test "$CERT" = "f8f7f6f4ee9dabfb6004af5862edffbe78fd48622d90a8ac6eb79128a63f7119" || (echo "Unexpected signing key. Refusing to provide incompatible test APK." && exit 1)
      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: zekify-v3.5.7-test-signed-apk
          path: Zekify-v3.5.7-test.apk
          if-no-files-found: error
          retention-days: 14
