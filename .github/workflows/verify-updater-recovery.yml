name: Verify Zekify updater recovery (no release)
on:
  push:
    branches:
      - fix/restore-updater-prompts-v3.5.8
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          npm_config_fetch_retries: "3"
          npm_config_fetch_timeout: "120000"
        run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Verify fullscreen player is unchanged
        run: git diff --exit-code d05b7577a753fe91394684ddc5205b380571e764...HEAD -- native-android/PlayerActivity.java scripts/fix-player-playback-state.mjs
      - name: Apply native Android source
        run: node scripts/patch-native-android.mjs
      - name: Apply native playback compatibility patch
        run: node scripts/fix-player-playback-state.mjs
      - name: Validate update installer manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          providers = [node for node in root.findall('.//provider') if node.attrib.get(ns+'name') == 'androidx.core.content.FileProvider']
          assert providers, 'FileProvider is missing'
          assert providers[0].attrib.get(ns+'authorities') == '${applicationId}.fileprovider'
          print('FileProvider verified')
          PY
      - name: Set test package version
        run: |
          sed -i 's/versionCode 1/versionCode 358/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "3.5.8"/' android/app/build.gradle
          grep -q 'versionCode 358' android/app/build.gradle
          grep -q 'versionName "3.5.8"' android/app/build.gradle
      - name: Configure production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/zekify-release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("../zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Build signed updater test APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v3.5.8-updater-test.apk
          cd ..
          rm -f android/zekify-release.jks
          test -s Zekify-v3.5.8-updater-test.apk
      - name: Verify production signing certificate and package version
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v3.5.8-updater-test.apk | tee signing-certificate.txt
          CERT="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' signing-certificate.txt)"
          test "$CERT" = "f8f7f6f4ee9dabfb6004af5862edffbe78fd48622d90a8ac6eb79128a63f7119"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.5.8-updater-test.apk | grep "package: name='com.v3x.zekify' versionCode='358' versionName='3.5.8'"
      - name: Upload signed updater test APK
        uses: actions/upload-artifact@v4
        with:
          name: zekify-v3.5.8-updater-fix-test
          path: Zekify-v3.5.8-updater-test.apk
          if-no-files-found: error
          retention-days: 14
