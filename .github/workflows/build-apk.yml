name: Build and release Zekify APK
on:
  workflow_dispatch:
  push:
    branches: [telegram-football-bot, main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true
      - run: npm install
      - run: npm run assets:generate
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Zekify-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zekify-v1.0.0-apk
          path: Zekify-v1.0.0.apk
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Zekify v1.0.0
          generate_release_notes: true
          files: Zekify-v1.0.0.apk
