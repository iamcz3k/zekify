name: Build and release Zekify APK
on:
  workflow_dispatch:
  push:
    branches: [telegram-football-bot, main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Configure native immersive player and launcher
        run: node scripts/patch-android.mjs
      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 8/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.5.1"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/zekify-release.jks
          test -s android/app/zekify-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          source = path.read_text()
          if "signingConfigs {" not in source:
              source = source.replace(
                  "    buildTypes {",
                  """    signingConfigs {
                  release {
                      storeFile file("zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {""",
                  1,
              )
          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          source, count = re.subn(
              pattern,
              r"\1\n            signingConfig signingConfigs.release",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate the Android release build type")
          path.write_text(source)
          PY
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v1.5.1.apk
          cd ..
          rm -f android/app/zekify-release.jks
          test -s Zekify-v1.5.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zekify-v1.5.1-signed-apk
          path: Zekify-v1.5.1.apk
          if-no-files-found: error
      - name: Publish signed APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1
          name: Zekify v1.5.1
          generate_release_notes: true
          files: Zekify-v1.5.1.apk
