name: Build and release Zekify APK
on:
  push:
    branches:
      - native-android-v2
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zekify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v2.2.0]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          npm_config_fetch_retries: "3"
          npm_config_fetch_timeout: "120000"
        run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Configure fully native Android UI and player
        run: node scripts/patch-native-android.mjs
      - name: Validate generated Android manifest
        run: |
          cat android/app/src/main/AndroidManifest.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('android/app/src/main/AndroidManifest.xml'); print('AndroidManifest.xml is valid XML')"
      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 11/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.2.0"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/zekify-release.jks
          test -s android/zekify-release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("../zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v2.2.0.apk
          cd ..
          rm -f android/zekify-release.jks
          test -s Zekify-v2.2.0.apk
      - name: Generate update checksum
        run: sha256sum Zekify-v2.2.0.apk > Zekify-v2.2.0.apk.sha256
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v2.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zekify-v2.2.0-signed-apk
          path: |
            Zekify-v2.2.0.apk
            Zekify-v2.2.0.apk.sha256
          if-no-files-found: error
      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.2.0 Zekify-v2.2.0.apk Zekify-v2.2.0.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v2.2.0 Zekify-v2.2.0.apk Zekify-v2.2.0.apk.sha256 --title "Zekify v2.2.0" --notes "Zekify Android feature update." --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
