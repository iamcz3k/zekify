# Zekify v3.5.5 signed production release build.
name: Build and release Zekify v3.5.5
on:
  push:
    branches:
      - v3.5.5-offline-cache-fighter
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zekify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          npm_config_fetch_retries: "3"
          npm_config_fetch_timeout: "120000"
        run: npm install --include=optional --no-audit --no-fund
      - name: Confirm v3.5.5 source branch
        run: git log -1 --oneline
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Configure fully native Android UI and player
        run: node scripts/patch-native-android.mjs
      - name: Fix native player loading state and source fill
        run: node scripts/fix-player-playback-state.mjs
      - name: Validate generated Android manifest
        run: |
          cat android/app/src/main/AndroidManifest.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('android/app/src/main/AndroidManifest.xml'); print('AndroidManifest.xml is valid XML')"
      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 355/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "3.5.5"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/zekify-release.jks
          test -s android/zekify-release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("../zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v3.5.5.apk
          cd ..
          rm -f android/zekify-release.jks
          test -s Zekify-v3.5.5.apk
      - name: Generate update checksum
        run: sha256sum Zekify-v3.5.5.apk > Zekify-v3.5.5.apk.sha256
      - name: Verify APK signature
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v3.5.5.apk | tee signing-certificate.txt
          CERT="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' signing-certificate.txt)"
          echo "Release signing certificate: $CERT"
          test "$CERT" = "f8f7f6f4ee9dabfb6004af5862edffbe78fd48622d90a8ac6eb79128a63f7119" || (echo "Unexpected signing key. Refusing to publish an incompatible update." && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: zekify-v3.5.5-release-apk
          path: |
            Zekify-v3.5.5.apk
            Zekify-v3.5.5.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.5.5 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create v3.5.5 --repo "${GITHUB_REPOSITORY}" --title "Zekify v3.5.5" --notes "Offline access gate with Zekify logo and settings shortcuts, aligned match names, centered LIVE/upcoming kickoff and date, centered timers, cached badges, and the fighting arcade mode."
          gh release upload v3.5.5 Zekify-v3.5.5.apk Zekify-v3.5.5.apk.sha256 --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit v3.5.5 --repo "${GITHUB_REPOSITORY}" --title "Zekify v3.5.5" --notes "Zekify v3.5.5: aligned team names, no VS/Watch Live labels, centered LIVE and kickoff details with timers, offline gate with app logo and working network settings shortcuts."
