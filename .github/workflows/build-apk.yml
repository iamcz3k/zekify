name: Build and release Zekify APK
on:
  workflow_dispatch:
  push:
    branches: [telegram-football-bot, main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Configure native immersive player and launcher
        run: node scripts/patch-android.mjs
      - name: Set Android version
        run: |
          sed -i 's/versionCode 1/versionCode 6/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.4.0"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Zekify-v1.4.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zekify-v1.4.0-apk
          path: Zekify-v1.4.0.apk
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Zekify v1.4.0
          generate_release_notes: true
          files: Zekify-v1.4.0.apk
