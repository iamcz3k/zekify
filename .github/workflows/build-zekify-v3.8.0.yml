name: Build and publish Zekify v3.8.0
# Workflow registered on the repository default branch; source is checked out from the triggering feature branch.
on:
  push:
    branches:
      - feature/zekify-v3.8.0-native-football
  workflow_dispatch:
concurrency:
  group: zekify-v3.8.0-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node dependencies
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          npm_config_fetch_retries: "3"
          npm_config_fetch_timeout: "120000"
        run: npm install --include=optional --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npm run assets:generate
      - run: npx cap sync android
      - name: Verify fullscreen changes are limited to the requested lock handoff
        run: |
          git diff --exit-code d05b7577a753fe91394684ddc5205b380571e764...HEAD -- scripts/fix-player-playback-state.mjs
          python3 - <<'PY'
          import subprocess
          base = "d05b7577a753fe91394684ddc5205b380571e764"
          diff = subprocess.check_output(["git", "diff", "--unified=0", f"{base}...HEAD", "--", "native-android/PlayerActivity.java"], text=True)
          changed = [line for line in diff.splitlines() if line.startswith(("+", "-")) and not line.startswith(("+++", "---"))]
          allowed = {
              '+        if (getIntent().getBooleanExtra("lockOnOpen", false)) lockScreen();'
          }
          assert set(changed).issubset(allowed), "Unexpected fullscreen player changes detected: " + repr(changed)
          assert changed, "Expected the explicitly requested lock handoff change was not found"
          print("Only the requested fullscreen lock-on-open hook changed; all other fullscreen code remains untouched.")
          PY
      - name: Verify Material Motion, predictive back, and splash screen
        run: |
          grep -q 'setDuration(300L)' native-android/MainActivity.java
          grep -q 'pendingMotionKind="container"' native-android/MainActivity.java
          grep -q 'OnBackInvokedDispatcher' native-android/MainActivity.java
          grep -q 'SplashScreen.installSplashScreen' native-android/MainActivity.java
          grep -q 'Zekify.Splash' scripts/patch-native-android.mjs
          grep -q 'MaterialMotion.java' scripts/patch-native-android.mjs
          grep -q 'PathInterpolator' native-android/LiveScoreActivity.java
      - name: Verify navigation transitions, mini-player unlock reset, and menu icon
        run: |
          grep -q 'setDuration(300L)' native-android/MainActivity.java
          grep -q 'setAnimatedScreen(root)' native-android/MainActivity.java
          grep -q 'returnedFromFullscreen' native-android/MainActivity.java
          grep -q 'miniLocked=false;updateMiniLockState();' native-android/MainActivity.java
          grep -q 'zekify_ic_menu' native-android/MainActivity.java
          test -s native-android/res/drawable/zekify_ic_menu.xml
          grep -q 'zekify_ic_menu.xml' scripts/patch-native-android.mjs
          grep -q 'setDuration(300L)' native-android/LiveScoreActivity.java
          grep -q 'PathInterpolator' native-android/UpdateHistoryActivity.java
      - name: Verify automatic live-source caching
        run: |
          grep -q 'Fetching sources…' native-android/MainActivity.java
          ! grep -q 'Finding available streams…' native-android/MainActivity.java
          ! grep -q 'LinearLayout discovery=row()' native-android/MainActivity.java
          grep -q 'readCachedMatchDetail(selectedSport,m.optString("id"))' native-android/MainActivity.java
          grep -q 'LiveSourcePrefetch.schedule(this)' native-android/MainActivity.java
          grep -q 'PeriodicWorkRequest' native-android/LiveSourcePrefetch.java
          grep -q '15, TimeUnit.MINUTES' native-android/LiveSourcePrefetch.java
          grep -q 'LiveSourcePrefetchWorker' scripts/patch-native-android.mjs
          grep -q 'androidx.work:work-runtime:2.9.1' scripts/patch-native-android.mjs
          grep -q 'live_sources_v1_' native-android/LiveSourcePrefetchWorker.java
      - name: Verify native football profiles, offline data, and original illustrations
        run: |
          grep -q 'FootballEntityActivity.kt' scripts/patch-native-android.mjs
          grep -q 'FollowedEntitiesActivity.kt' scripts/patch-native-android.mjs
          grep -q 'android:name=".FollowedEntitiesActivity"' scripts/patch-native-android.mjs
          grep -q 'Followed teams & leagues' native-android/MainActivity.java
          grep -q 'offlineMotion.cancel' native-android/MainActivity.java
          grep -q 'android:name=".FootballEntityActivity"' scripts/patch-native-android.mjs
          grep -q 'profile.putExtra("entity_type","team")' native-android/MainActivity.java
          grep -q 'profile.putExtra("entity_type","competition")' native-android/MainActivity.java
          ! grep -q 'Continue offline' native-android/MainActivity.java
          grep -q 'matches_cached_at_' native-android/MainActivity.java
          grep -q 'resolveBundledTeamBadge' native-android/TeamBadgeCatalog.kt
          grep -q 'normalize' native-android/TeamBadgeCatalog.kt
          ! grep -q ',ORANGE,true)' native-android/MainActivity.java
          grep -q 'case "broadcast"' native-android/MainActivity.java
          grep -q 'configureTeamName(eventName)' native-android/MainActivity.java
          grep -q 'dp(32),dp(32)' native-android/MainActivity.java
          grep -q 'Follows' native-android/MainActivity.java
          grep -q 'showFollowPicker' native-android/MainActivity.java
          grep -q 'heart-filled' native-android/MainActivity.java
          grep -q 'followed_match_ids' native-android/MatchReminderReceiver.java
          grep -q 'followed_match_ids' native-android/MatchReminderBootReceiver.java
          grep -q 'HEAD-TO-HEAD' native-android/FootballEntityActivity.kt
          grep -q 'RECENT FORM' native-android/FootballEntityActivity.kt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              "native-android/res/drawable/zekify_illustration_offline.xml",
              "native-android/res/drawable/zekify_illustration_empty_fixtures.xml",
          ]:
              ET.parse(path)
              print("Valid vector drawable:", path)
          PY
      - name: Strip unused website bundle from native APK
        run: |
          rm -rf android/app/src/main/assets/public
          test ! -e android/app/src/main/assets/public/index.html
          echo "Native Activity screens and remote provider WebViews are retained; bundled Vite website UI is excluded."
      - name: Test and build the global team and league badge bundle
        run: |
          node scripts/download-global-badges.mjs --self-test
          node scripts/download-global-badges.mjs
      - name: Apply native Android source
        run: node scripts/patch-native-android.mjs
      - name: Apply native playback compatibility patch
        run: node scripts/fix-player-playback-state.mjs
      - name: Validate update installer manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          providers = [node for node in root.findall('.//provider') if node.attrib.get(ns+'name') == 'androidx.core.content.FileProvider']
          assert providers, 'FileProvider is missing'
          assert providers[0].attrib.get(ns+'authorities') == '${applicationId}.fileprovider'
          print('FileProvider verified')
          PY
      - name: Set test package version
        run: |
          sed -i 's/versionCode 1/versionCode 381/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "3.8.0"/' android/app/build.gradle
          grep -q 'versionCode 381' android/app/build.gradle
          grep -q 'versionName "3.8.0"' android/app/build.gradle
      - name: Verify updater handoff, notifications, and build metadata
        run: |
          grep -q 'parseBuildCode' native-android/ZekifyUpdateManager.java
          grep -q 'pending_build_code' native-android/ZekifyUpdateManager.java
          grep -q 'ACTION_INSTALL_PACKAGE' native-android/ZekifyUpdateManager.java
          grep -q 'requestUpdateNotificationPermission' native-android/MainActivity.java
          ! grep -q 'different certificate' native-android/ZekifyUpdateManager.java
          grep -q 'POST_NOTIFICATIONS' scripts/patch-native-android.mjs
      - name: Configure production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/zekify-release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("../zekify-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Build signed updater test APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Zekify-v3.8.0-updater-test.apk
          cd ..
          rm -f android/zekify-release.jks
          test -s Zekify-v3.8.0-updater-test.apk
      - name: Verify production signing certificate and package version
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Zekify-v3.8.0-updater-test.apk | tee signing-certificate.txt
          CERT="$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' signing-certificate.txt)"
          test "$CERT" = "f8f7f6f4ee9dabfb6004af5862edffbe78fd48622d90a8ac6eb79128a63f7119"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Zekify-v3.8.0-updater-test.apk | grep "package: name='com.v3x.zekify' versionCode='380' versionName='3.8.0'"
      - name: Publish verified v3.8.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_SHA="$(git ls-remote origin refs/heads/feature/zekify-v3.8.0-native-football | awk '{print $1}')"
          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then echo "Superseded build; only the latest branch commit may publish."; exit 1; fi
          cp Zekify-v3.8.0-updater-test.apk Zekify-v3.8.0.apk
          sha256sum Zekify-v3.8.0.apk > Zekify-v3.8.0.apk.sha256
          cat > release-notes-v3.8.0.md <<'NOTES'
          Build code: 380

          - Bundled 5,083 team badges and 216 competition badges from a global collection spanning 235 country/region pages, national teams and tournaments.
          - Optimized the 128px transparent WebP badge library for local/offline use, with stable-ID and country-aware name matching plus common aliases.
          - Kept genuine provider-logo fetching and persistent on-device caching as the fallback for badges not in the bundle.
          - Added native Kotlin team and competition profiles with cached fixture history.
          - Added a native Followed Teams & Competitions screen with locally stored favourites.
          - Enforced online-only app entry with a blocking offline connection gate, connection refresh, Wi-Fi settings and mobile-data settings.
          - Added the installed app version to the splash screen and original native vector illustrations with subtle motion.
          - Removed the unused bundled Vite website UI from the APK. Native Android screens remain; WebViews are retained only for remote streaming providers.
          - Preserved existing match navigation, reminders, updater, mini-player and streaming behaviour.
          - Preserved the existing fullscreen player implementation and behaviour.

          Badge artwork source: https://football-logos.cc/
          This collection is used under the source's non-commercial informational/editorial/fan-project terms. Zekify remains free and ad-free; all club and competition marks remain owned by their respective rights holders.
          NOTES
          if gh release view v3.8.0 --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload v3.8.0 Zekify-v3.8.0.apk Zekify-v3.8.0.apk.sha256 --repo ${{ github.repository }} --clobber
            gh release edit v3.8.0 --repo ${{ github.repository }} --title "Zekify v3.8.0" --notes-file release-notes-v3.8.0.md
          else
            gh release create v3.8.0 Zekify-v3.8.0.apk Zekify-v3.8.0.apk.sha256 --repo ${{ github.repository }} --target "$GITHUB_SHA" --title "Zekify v3.8.0" --notes-file release-notes-v3.8.0.md
          fi
          gh release view v3.8.0 --repo ${{ github.repository }} --json tagName,assets,body
      - name: Upload signed updater test APK
        uses: actions/upload-artifact@v4
        with:
          name: zekify-v3.8.0-release
          path: Zekify-v3.8.0-updater-test.apk
          if-no-files-found: error
          retention-days: 14
